<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Vidrop · Portfolio prototype</title>
<style>
@font-face {
  font-family: 'Manrope';
  font-style: normal;
  font-weight: 400 800;
  font-display: swap;
  src: url(fonts/manrope-vietnamese-ab25cc20.woff2) format('woff2');
  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
}
@font-face {
  font-family: 'Manrope';
  font-style: normal;
  font-weight: 400 800;
  font-display: swap;
  src: url(fonts/manrope-latin-ext-f0f3d418.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Manrope';
  font-style: normal;
  font-weight: 400 800;
  font-display: swap;
  src: url(fonts/manrope-latin-c8eafee8.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root{--bg:#F6F5F1;--ink:#151515;--muted:#4F4F4A;--line:#CFCDC4;--acc:#0F766E;--accd:#0B5A54;--panel:#ECEAE3;--f:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--f);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:1480px;margin:0 auto;padding:0 20px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:2px solid var(--ink)}
h1{font-size:20px;margin:0;letter-spacing:-.02em;font-weight:800}
h1 span{font-weight:500;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab,.seg button,.st,.lang,.ghost{min-height:44px;min-width:44px;padding:0 16px;border:2px solid var(--ink);background:transparent;border-radius:12px;font-weight:700}
.tab[aria-selected=true],.seg button[aria-pressed=true],.st[aria-current=true],.lang[aria-pressed=true]{background:var(--ink);color:#fff}
.tab:hover:not([aria-selected=true]),.seg button:hover:not([aria-pressed=true]),.st:hover:not([aria-current=true]),.ghost:hover{background:var(--panel)}
.tab:disabled{opacity:.55;cursor:not-allowed;border-style:dashed}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;gap:6px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding:24px 0 48px}
.side{display:grid;gap:20px;align-content:start}
.side h2{font-size:17px;margin:0 0 6px}
dl.notes{margin:0;display:grid;gap:10px}
dl.notes div{padding:12px 0;border-top:1px solid var(--line)}
dl.notes dt{font-weight:800;margin-bottom:2px}
dl.notes dd{margin:0;color:var(--muted)}
.states{display:flex;flex-wrap:wrap;gap:8px}
.st{text-align:left;padding:0 14px}
.stage{background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:20px;min-height:420px;display:grid;place-items:start center;overflow:hidden}
.phone{width:407px;max-width:100%;background:#111;border-radius:44px;padding:14px 16px;box-shadow:0 20px 40px rgba(0,0,0,.18)}
.phone .notch{width:96px;height:6px;border-radius:99px;background:#333;margin:2px auto 10px}
.phone iframe{display:block;width:375px;max-width:100%;height:760px;border:0;border-radius:24px;background:#fff}
.deskwrap{width:100%;overflow:hidden}
.desk{transform-origin:top left;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.desk iframe{display:block;width:1280px;height:800px;border:0}
.hint{color:var(--muted);margin:8px 0 0}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
@media(min-width:1000px){main{grid-template-columns:340px minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>Vidrop <span data-i="sub"></span></h1>
 <div class="bar">
  <div class="tabs" role="tablist" id="tabs" data-al="variant">
   <button class="tab" role="tab" data-v="v1" id="t-v1">V1 · Command bar</button>
   <button class="tab" role="tab" data-v="v2" id="t-v2">V2 · Workspace</button>
   <button class="tab" role="tab" data-v="v3" id="t-v3">V3 · Bold type</button>
  </div>
  <div class="seg" role="group" data-al="lang"><button class="lang" data-l="vi" aria-pressed="true">VI</button><button class="lang" data-l="en" aria-pressed="false">EN</button></div>
 </div>
</header>
<main>
 <aside class="side">
  <section><h2 data-i="notes"></h2>
   <dl class="notes"><div><dt data-i="concept"></dt><dd id="n-c"></dd></div><div><dt data-i="strong"></dt><dd id="n-s"></dd></div><div><dt data-i="weak"></dt><dd id="n-w"></dd></div></dl>
  </section>
  <section><h2 data-i="device"></h2>
   <div class="seg" role="group"><button class="dev" data-d="mobile" aria-pressed="true"><span data-i="mobile"></span> 375</button><button class="dev" data-d="desktop" aria-pressed="false"><span data-i="desktop"></span> 1280</button></div>
  </section>
  <section><h2 data-i="states"></h2>
   <div class="states" id="states"></div>
   <p class="hint" data-i="hint"></p>
   <p><button class="ghost" id="reset" data-i="reset"></button></p>
  </section>
 </aside>
 <section class="stage" id="stage" aria-live="polite">
  <div class="phone" id="phone"><div class="notch"></div><iframe id="fm" title="Vidrop mobile prototype"></iframe></div>
  <div class="deskwrap" id="deskwrap" hidden><div class="desk" id="desk"><iframe id="fd" title="Vidrop desktop prototype"></iframe></div></div>
  <p class="empty" id="soon" hidden></p>
 </section>
</main>
</div>
<script>
(function(){
var T={vi:{sub:"· bộ prototype",notes:"Ghi chú phương án",concept:"Ý tưởng",strong:"Điểm mạnh",weak:"Điểm yếu",device:"Thiết bị",mobile:"Điện thoại",desktop:"Máy tính",states:"Trạng thái",reset:"Chạy lại từ đầu",variant:"Chọn phương án",lang:"Ngôn ngữ",
hint:"Bạn cũng có thể tự bấm trong khung: Dán → Kiểm tra link → Tải video.",soon:"Phương án này sẽ được dựng sau khi duyệt khuôn V1.",
st:["Trống","Đang phân tích","Kết quả","Đang tải","Hoàn tất","Lỗi link","Lỗi nền tảng","Lỗi mạng","Lịch sử"]},
en:{sub:"· prototype set",notes:"Variant notes",concept:"Concept",strong:"Strength",weak:"Weakness",device:"Device",mobile:"Phone",desktop:"Desktop",states:"States",reset:"Restart",variant:"Choose a variant",lang:"Language",
hint:"You can also click through inside the frame: Paste → Check link → Download.",soon:"This variant is built after the V1 frame is approved.",
st:["Empty","Analyzing","Result","Downloading","Done","Link error","Platform error","Network error","History"]}};
var N={v1:{vi:["Một ô nhập khổng lồ ở giữa, kết quả bung ngay bên dưới, ngăn cách bằng đường kẻ thay vì thẻ. Teal trên nền giấy ấm.","Đường đi ngắn nhất (dán, chọn, tải). Một cột nên hợp mobile, nút Tải dính đáy màn hình.","Desktop hơi trống, ít cá tính, gần với \"mặc định sạch\"."],en:["One huge input in the middle, the result opens right below, separated by rules instead of cards. Teal on warm paper.","Shortest path (paste, choose, download). Single column suits mobile; the Download button sticks to the bottom.","Desktop feels a bit empty and low on personality, close to a clean default."]},
v2:{vi:["Hai cột: trái là ô nhập, phiên tải và lịch sử; phải là preview và tuỳ chọn. Tối than chì với màu hổ phách.","Hợp người tải nhiều link hoặc playlist, thấy hàng đợi và preview cùng lúc, mật độ cao.","Thừa với người chỉ tải một link; ô preview trống khi chưa có link; trên mobile phải cuộn qua preview mới tới hàng đợi."],en:["Two columns: input, session and history on the left; preview and options on the right. Graphite with amber.","Suits people downloading many links or playlists: queue and preview side by side, dense.","Overkill for a single link; the preview pane is empty before a link; on mobile you scroll past the preview to reach the queue."]},
v3:{vi:["Chữ khổng lồ in hoa, khối màu full-bleed đổi theo nền tảng (YouTube đỏ, hoàn tất xanh chanh, lỗi đen).","Nhận diện mạnh, trạng thái đọc được từ xa, platform thể hiện bằng màu thay vì chip.","Ồn và tốn chiều cao, hero lớn đẩy công cụ xuống trên mobile nhỏ; mỗi platform mới cần chọn thêm một màu."],en:["Giant uppercase type and full-bleed colour blocks that change per platform (YouTube red, done lime, error black).","Strong identity, states readable from afar, platform shown by colour rather than chips.","Loud and tall; the big hero pushes the tool down on small phones; every new platform needs another colour."]}};
var KEYS=["empty","analyzing","result","downloading","done","error-link","error-platform","error-network","history"];
var ready={v1:true,v2:true,v3:true};
var q=new URLSearchParams((location.hash||'').slice(1));
var S={v:q.get('v')||'v1',d:q.get('d')||'mobile',l:q.get('l')==='en'?'en':'vi',s:q.get('state')||'empty'};
if(KEYS.indexOf(S.s)<0)S.s='empty';if(!N[S.v])S.v='v1';
function $(s){return document.querySelector(s)}
function $$(s){return [].slice.call(document.querySelectorAll(s))}
function build(){var h=$('#states');h.innerHTML=KEYS.map(function(k,i){return '<button class="st" data-k="'+k+'">'+(i+1)+' · <span></span></button>'}).join('');
 $$('.st').forEach(function(b){b.addEventListener('click',function(){S.s=b.dataset.k;load()})})}
function src(v){return v+'.html?state='+S.s+'&lang='+S.l}
function scale(){var w=$('#deskwrap').clientWidth,k=Math.min(1,w/1280);$('#desk').style.transform='scale('+k+')';$('#desk').style.width='1280px';$('#deskwrap').style.height=(800*k+2)+'px'}
function load(){var ok=ready[S.v];$('#soon').hidden=ok;$('#phone').hidden=!ok||S.d!=='mobile';$('#deskwrap').hidden=!ok||S.d!=='desktop';
 if(ok){var fr=S.d==='mobile'?$('#fm'):$('#fd');fr.src=src(S.v);if(S.d==='desktop')scale()}
 paint()}
function paint(){var t=T[S.l];document.documentElement.lang=S.l;
 $$('[data-i]').forEach(function(e){e.textContent=t[e.dataset.i]});$$('[data-al]').forEach(function(e){e.setAttribute('aria-label',t[e.dataset.al])});
 $('#soon').textContent=t.soon;
 $$('.tab').forEach(function(b){var on=b.dataset.v===S.v;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;b.disabled=!ready[b.dataset.v]&&!on&&false});
 var n=N[S.v][S.l];$('#n-c').textContent=n[0];$('#n-s').textContent=n[1];$('#n-w').textContent=n[2];
 $$('.lang').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===S.l)});
 $$('.dev').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.d===S.d)});
 $$('.st').forEach(function(b){var i=KEYS.indexOf(b.dataset.k);b.querySelector('span').textContent=t.st[i];b.setAttribute('aria-current',b.dataset.k===S.s)});
 try{history.replaceState(null,'','#v='+S.v+'&d='+S.d+'&l='+S.l+'&state='+S.s)}catch(e){}}
build();
$$('.tab').forEach(function(b,i,a){b.addEventListener('click',function(){S.v=b.dataset.v;load()});b.addEventListener('keydown',function(e){var j=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:-1;if(j>=0){a[(j+a.length)%a.length].focus();a[(j+a.length)%a.length].click();e.preventDefault()}})});
$$('.lang').forEach(function(b){b.addEventListener('click',function(){S.l=b.dataset.l;load()})});
$$('.dev').forEach(function(b){b.addEventListener('click',function(){S.d=b.dataset.d;load()})});
$('#reset').addEventListener('click',load);
window.addEventListener('resize',function(){if(S.d==='desktop')scale()});
window.addEventListener('message',function(e){var k=e.data&&e.data.vidropState;if(k&&KEYS.indexOf(k)>=0&&k!==S.s){S.s=k;paint()}});
load();
})();
</script>
</body>
</html>

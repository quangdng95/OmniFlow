:root{color-scheme:dark;--bg:#0D1117;--pane:#121821;--raise:#1A2230;--line:#2A3444;--ink:#E8EEF5;--muted:#A3B0C0;--amber:#F5B63D;--amber-d:#E0A02A;--onamber:#1A1200;--green:#5EE08A;--red:#FF8A80;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--amber);color:var(--onamber);padding:12px 16px;border-radius:6px;z-index:10}.skip:focus{left:8px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:56px;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.brand{font:600 20px var(--mono);color:var(--ink);text-decoration:none;display:flex;gap:10px;align-items:center;min-height:44px}
.brand b{color:var(--amber)}
nav{display:flex;gap:2px}
.nb{min-height:44px;min-width:44px;padding:0 12px;background:transparent;border:0;border-radius:8px;display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nb:hover{background:var(--raise)}
main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"input" "detail" "queue"}
.input{grid-area:input;padding:20px 16px;border-bottom:1px solid var(--line)}
.detail{grid-area:detail;background:var(--pane);padding:20px 16px;min-height:260px;border-bottom:1px solid var(--line)}
.queue{grid-area:queue;padding:20px 16px 40px}
h1{font:600 22px/1.25 var(--sans);margin:0 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 16px;color:var(--muted)}
.lab{display:block;font-weight:500;margin-bottom:6px}
.field{display:flex;flex-wrap:wrap;gap:8px}
.field input{flex:1 1 100%;min-width:0;height:52px;background:var(--bg);border:1.5px solid #5A687C;border-radius:8px;padding:0 14px;font:400 16px var(--mono);color:var(--ink)}
.field input::placeholder{color:#8795A8;opacity:1}
.field input:focus-visible{outline:3px solid var(--amber);outline-offset:0;border-color:var(--amber)}
.field input[aria-invalid=true]{border-color:var(--red)}
.btn{min-height:48px;padding:0 18px;border-radius:8px;border:1.5px solid #5A687C;background:transparent;color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--raise)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--onamber)}.btn.pri:hover{background:var(--amber-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field .btn{flex:1 1 40%}.field .btn.pri{flex:1 1 55%}
.hint{margin:12px 0 0;color:var(--muted);font-size:16px}
.status,.err{margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:8px}
.status{background:var(--raise)}
.err{background:#2A1517;border:1px solid #7A3B3B;align-items:flex-start}
.err b{display:block;color:var(--red)}.err p{margin:0}
.err .ic{color:var(--red);margin-top:2px}
.spin svg{animation:sp .9s linear infinite;color:var(--amber)}@keyframes sp{to{transform:rotate(360deg)}}
.link{background:none;border:0;min-height:44px;min-width:44px;padding:0 10px;text-decoration:underline;text-underline-offset:3px;font-weight:600;border-radius:6px}
/* detail */
.empty-d{display:grid;gap:10px;align-content:center;min-height:0;color:var(--muted)}
.empty-d .big{font:500 16px var(--mono);color:var(--ink)}
.plist{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:16px;color:var(--ink)}
.thumb{background:linear-gradient(135deg,#243247,#3A2A12);display:grid;place-items:center;color:var(--amber);border-radius:6px;position:relative}
.thumb.big{aspect-ratio:16/9;width:100%;max-width:560px}
.thumb.big .dur{position:absolute;right:8px;bottom:8px;background:#000;color:#fff;font:500 16px var(--mono);padding:1px 7px;border-radius:4px}
.thumb.sm{width:56px;height:42px;flex:none;border-radius:4px}
.title{font:600 20px/1.3 var(--sans);margin:14px 0 2px}
.meta{color:var(--muted);font:400 16px var(--mono);margin:0 0 18px}
.opts{display:grid;gap:14px;margin-bottom:18px}
.grp{border:0;margin:0;padding:0;min-width:0}.grp legend{padding:0;margin-bottom:6px;font-weight:500}
.seg{display:inline-flex;background:var(--bg);border:1.5px solid #5A687C;border-radius:8px;padding:3px;gap:3px}
.seg input,.opt input{position:absolute;opacity:0;width:1px;height:1px}
.seg span.s{display:flex;gap:8px;align-items:center;min-height:44px;padding:0 18px;border-radius:5px;font-weight:600;cursor:pointer}
.seg input:checked+span.s{background:var(--amber);color:var(--onamber)}
.seg input:focus-visible+span.s,.opt input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
#qopts{display:flex;flex-wrap:wrap;gap:8px}
.opt span{display:flex;align-items:center;min-height:44px;padding:0 16px;border:1.5px solid #5A687C;border-radius:8px;font:500 16px var(--mono);cursor:pointer}
.opt input:checked+span{border-color:var(--amber);color:var(--amber);background:#241C0A;box-shadow:inset 0 0 0 1px var(--amber)}
.opt span:hover{background:var(--raise)}
.prog{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:8px 0 12px}
.bar-fill{height:100%;background:var(--amber);width:0;transition:width .14s linear}
.pline{font:500 17px var(--mono)}
.okline{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--green);font-size:18px}
.sizeNote{font:400 16px var(--mono);color:var(--muted);margin:2px 0 16px}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts .btn{flex:1 1 200px}
/* queue */
h2{font:600 17px var(--sans);margin:0 0 10px}
ul.rows{list-style:none;margin:0 0 28px;padding:0;border-top:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:64px}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row b{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row small{color:var(--muted);font:400 16px var(--mono)}
.idx{font:500 16px var(--mono);color:var(--muted);width:26px}
.rbtn{min-height:44px;padding:0 12px;background:transparent;border:1.5px solid #5A687C;border-radius:8px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.rbtn:hover{background:var(--raise)}.rbtn.is-done{border-color:transparent;color:var(--green)}
.q.cur{background:var(--raise);padding-inline:10px;margin-inline:-10px;border-radius:8px}
.st{font:500 16px var(--mono);white-space:nowrap}
.st.ok{color:var(--green)}.st.bad{color:var(--red)}.st.am{color:var(--amber)}
.plhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.plhead h2{margin:0}
.about details{border-top:1px solid var(--line)}
.about summary{list-style:none;min-height:52px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer;border-radius:6px}
.about summary::-webkit-details-marker{display:none}
.about summary svg{transition:transform .2s}.about details[open] summary svg{transform:rotate(180deg)}
.about .in{padding:0 0 16px;color:var(--muted)}
.about ol{margin:0;padding-left:22px}.about dl{margin:0}.about dt{color:var(--ink);font-weight:600;margin-top:10px}.about dd{margin:0}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px 16px 28px;border-top:1px solid var(--line);color:var(--muted)}
footer a{color:var(--ink);min-height:44px;display:inline-flex;align-items:center}
#demoBar{position:fixed;left:8px;bottom:8px;z-index:50;background:var(--amber);color:var(--onamber);border-radius:8px;padding:6px 10px;font-size:16px;display:flex;gap:8px;align-items:center}
#demoBar select{min-height:36px;font-size:16px;border-radius:6px;border:0;padding:0 6px;color:#000}
@media(min-width:960px){
.empty-d{min-height:300px}
header.top{padding:0 24px}
main{grid-template-columns:minmax(380px,460px) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"input detail" "queue detail";min-height:calc(100vh - 57px)}
.input{padding:28px 24px 20px;border-bottom:0}
.queue{padding:8px 24px 80px}
.detail{border-bottom:0;border-left:1px solid var(--line);padding:32px 40px}
h1{font-size:26px}
.thumb.big{max-width:none}
.optsrow{display:flex;gap:32px;flex-wrap:wrap}
footer{padding-inline:24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>

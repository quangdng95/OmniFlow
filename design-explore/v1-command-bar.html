<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vidrop · v1 Command bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--ink:#0A2624;--muted:#40605C;--teal:#0F766E;--teal-d:#0B5A54;--tint:#DCEBE6;--line:#BDB6A5;--err:#8F1B33;--errbg:#F9E3E3;--r:16px;
--f:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--f);padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;z-index:10}.skip:focus{left:8px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;min-height:64px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--teal-d);text-decoration:none;display:flex;align-items:center;gap:8px;min-height:44px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--teal);display:block}
nav{display:flex;gap:4px}
.nb{min-height:44px;min-width:44px;padding:0 14px;border:0;background:transparent;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.nb:hover{background:var(--tint)}
.hero{padding:28px 0 8px}
h1{font-size:clamp(34px,8.6vw,64px);line-height:1.02;letter-spacing:-.035em;margin:0 0 12px;font-weight:800;max-width:11em}
.sub{margin:0 0 28px;color:var(--muted);font-size:18px;max-width:34em}
.lab{display:block;font-weight:700;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:0;border:2.5px solid var(--ink);border-radius:var(--r);background:#fff;overflow:hidden}
.bar:focus-within{outline:3px solid var(--teal);outline-offset:3px}
.bar input{flex:1 1 100%;min-width:0;height:64px;border:0;padding:0 18px;font-size:18px;background:transparent;outline:0}
.bar input::placeholder{color:#5B6F6C;opacity:1}
.bar .ghost,.bar .go{height:56px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:800;padding:0 20px}
.bar .ghost{flex:0 0 auto;background:var(--tint);color:var(--ink);border-top:2.5px solid var(--ink);flex:1 1 40%}
.bar .go{flex:1 1 60%;background:var(--teal);color:#fff;border-top:2.5px solid var(--ink);border-left:2.5px solid var(--ink)}
.bar .go:hover{background:var(--teal-d)}.bar .go:disabled{opacity:.55;cursor:not-allowed}
.bar .ghost:hover{background:#CBE0D9}
.plat{margin:18px 0 0;color:var(--muted)}
.flow{margin:6px 0 0;color:var(--muted)}
.status,.err{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px;padding:16px 0 0;border-top:2px solid var(--ink)}
.status b,.err b{display:block;font-size:18px}
.status span.t{color:var(--muted)}
.err{color:var(--err);border-top-color:var(--err)}
.err p{margin:0;color:var(--ink)}
.err .ic{align-self:flex-start;margin-top:2px}
.spin svg{animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.link{background:none;border:0;min-height:44px;min-width:44px;padding:0 12px;font-weight:800;text-decoration:underline;text-underline-offset:3px;border-radius:8px}
.btn{min-height:52px;padding:0 24px;border-radius:14px;border:2.5px solid var(--ink);background:var(--teal);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{background:var(--teal-d)}
.btn.alt{background:transparent;color:var(--ink)}.btn.alt:hover{background:var(--tint)}
.btn.red{background:var(--err);border-color:var(--err)}
/* result */
.result{margin-top:36px;padding-top:28px;border-top:6px solid var(--teal);display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.thumb{background:linear-gradient(135deg,#0F766E,#134E4A 60%,#CA8A04);position:relative;border-radius:12px;display:grid;place-items:center;color:#fff}
.thumb.big{aspect-ratio:16/9;width:100%}
.thumb.big .dur{position:absolute;right:10px;bottom:10px;background:#0A2624;color:#fff;font-size:16px;font-weight:700;padding:2px 8px;border-radius:6px}
.thumb.sm{width:64px;height:48px;flex:none;border-radius:8px}
.title{font-size:clamp(22px,4.6vw,30px);line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
.meta{color:var(--muted);margin:0 0 22px}
.grp{margin:0 0 18px;border:0;padding:0;min-width:0}
.grp legend{font-weight:700;padding:0;margin-bottom:8px}
.seg{display:flex;max-width:100%;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden}
.seg label{display:block;flex:1}.seg label>span{justify-content:center}
.seg input,.opt input{position:absolute;opacity:0;width:1px;height:1px}
.seg label>span{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;font-weight:800;cursor:pointer}
.seg input:checked+span{background:var(--ink);color:#fff}
.seg label+label>span{border-left:2.5px solid var(--ink)}
.seg input:focus-visible+span,.opt input:focus-visible+span{outline:3px solid var(--teal);outline-offset:-5px}
#qopts{display:flex;flex-wrap:wrap;gap:8px}
.opt span{display:flex;align-items:center;min-height:48px;padding:0 18px;border:2.5px solid var(--ink);border-radius:14px;font-weight:700;cursor:pointer;background:transparent}
.opt input:checked+span{background:var(--tint);box-shadow:inset 0 0 0 2px var(--ink)}
.opt span:hover{background:var(--tint)}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions .btn{flex:1 1 220px;font-size:18px;min-height:56px}
.prog{height:14px;border-radius:99px;background:#fff;border:2.5px solid var(--ink);overflow:hidden;margin:6px 0 10px}
.bar-fill{height:100%;background:var(--teal);width:0;transition:width .14s linear}
.pline{display:flex;justify-content:space-between;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:14px}
.done-t{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;margin:0 0 4px;color:var(--teal-d)}
.sizeNote{color:var(--muted);margin:0 0 18px}
/* lists */
ul.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1.5px solid var(--line);min-height:64px}
.row:last-child{border-bottom:1.5px solid var(--line)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row b{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row small{color:var(--muted);font-size:16px}
.idx{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);width:28px}
.rbtn{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:12px;background:transparent;font-weight:800;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.rbtn:hover{background:var(--tint)}.rbtn.is-done{border-color:transparent;color:var(--teal-d)}
.sec{margin-top:44px}
.sec h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
.sec .note{margin:0 0 12px;color:var(--muted);font-size:16px}
.plhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.plhead h2{margin:0}
/* about */
.about{margin-top:56px;border-top:2px solid var(--ink)}
.about details{border-bottom:1.5px solid var(--line)}
.about summary{list-style:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:18px;cursor:pointer;border-radius:8px}
.about summary::-webkit-details-marker{display:none}
.about summary svg{transition:transform .2s}.about details[open] summary svg{transform:rotate(180deg)}
.about .in{padding:0 0 18px;color:var(--muted);max-width:40em}
.about ol{margin:0;padding-left:22px}.about ol li{margin:4px 0}
.about dl{margin:0}.about dt{font-weight:800;color:var(--ink);margin-top:12px}.about dd{margin:2px 0 0}
footer{padding:28px 0 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted)}
footer a{color:var(--ink);font-weight:700;display:inline-flex;min-height:44px;align-items:center}
#demoBar{position:fixed;left:8px;bottom:8px;z-index:50;background:#0A2624;color:#fff;border-radius:12px;padding:6px 10px;font-size:16px;display:flex;gap:8px;align-items:center;opacity:.92}
#demoBar select{min-height:36px;font-size:16px;border-radius:8px;border:0;padding:0 6px}
@media(min-width:720px){
.wrap{padding:0 32px}
.hero{padding-top:64px}
.bar{flex-wrap:nowrap;align-items:center}
.bar input{flex:1 1 auto;height:76px;font-size:20px;padding:0 24px}
.bar .ghost,.bar .go{height:76px;flex:0 0 auto;border-top:0}
.bar .ghost{border-left:2.5px solid var(--ink)}
.bar .go{border-left:2.5px solid var(--ink);padding:0 32px;font-size:18px}
.result{grid-template-columns:340px minmax(0,1fr);gap:36px}
}
@media(max-width:719px){
.actions.stick{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--ink);margin:0 -20px;padding-inline:20px;z-index:5}
.actions .btn{flex:1 1 100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}
</style>
</head>

var $=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var qs=new URLSearchParams(location.search);
var lang=qs.get('lang')||((navigator.language||'').slice(0,2)==='vi'?'vi':'en');
var state='empty',errKind='invalid',kind='video',pct=64,timer=null,tm=null;
var SAMPLE='https://www.youtube.com/watch?v=jNQXAC9IVRw';
var SUPPORTED=/(youtube\.com|youtu\.be|tiktok\.com|instagram\.com|facebook\.com|fb\.watch|x\.com|twitter\.com|threads\.(com|net)|linkedin\.com|rednote\.com|xiaohongshu\.com)/i;
function t(k){return D[lang][k]}
function icons(){$$('[data-icon]').forEach(function(e){if(e.dataset.done)return;e.dataset.done=1;e.innerHTML='<svg viewBox="0 0 24 24" width="'+(e.dataset.size||20)+'" height="'+(e.dataset.size||20)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+IC[e.dataset.icon]+'</svg>'})}
function rowHTML(title,meta,label,done,idx){return '<li class="row"><span class="thumb sm" aria-hidden="true"></span>'+(idx?'<span class="idx" aria-hidden="true">'+idx+'</span>':'')+'<span class="rt"><b>'+title+'</b><small>'+meta+'</small></span><button type="button" class="rbtn'+(done?' is-done':'')+'">'+label+'</button></li>'}
function renderLists(){
var h=$('#hist'),p=$('#plist');
if(h)h.innerHTML=rowHTML(t('t1'),'YouTube · 2:47',t('again'))+rowHTML(t('t2'),'TikTok · 0:48',t('again'))+rowHTML(t('t3'),'Instagram · 1:05',t('again'));
if(p)p.innerHTML=rowHTML(t('t1'),'2:47',t('rowDone'),true,'01')+rowHTML(t('t2'),'8:12',t('rowDl'),false,'02')+rowHTML(t('t3'),'10:03',t('rowDl'),false,'03')+rowHTML(t('t4'),'4:31',t('rowDl'),false,'04');
$$('.rbtn.is-done').forEach(function(b){b.insertAdjacentHTML('afterbegin','<span data-icon="check" data-size="16"></span>')});
icons()}
function renderQ(){
var q=$('#qopts');if(!q)return;
var o=kind==='video'?[['best',t('best')],['1080','1080p'],['720','720p'],['480','480p']]:[['best',t('best')],['128',t('std')]];
q.innerHTML=o.map(function(x,i){return '<label class="opt"><input type="radio" name="q" value="'+x[0]+'"'+(i===0?' checked':'')+'><span>'+x[1]+'</span></label>'}).join('')}
function errText(){var k={invalid:['errInvalidT','errInvalidB','btnOther'],unsupported:['errUnsupT','errUnsupB','btnOther'],network:['errNetT','errNetB','btnRetry']}[errKind];
$('#errT').textContent=t(k[0]);$('#errB').textContent=t(k[1]);$('#retry').firstChild&&0;var r=$('#retryLbl');if(r)r.textContent=t(k[2])}
function setProgress(){$$('.pct').forEach(function(e){e.textContent=pct+'%'});$$('.bar-fill').forEach(function(e){e.style.width=pct+'%'});$$('[role=progressbar]').forEach(function(e){e.setAttribute('aria-valuenow',pct)})}
function render(){
document.body.dataset.state=state;document.body.dataset.err=errKind;
$$('[data-s]').forEach(function(e){e.hidden=e.dataset.s.split(' ').indexOf(state)<0});
var u=$('#url');
if(u){u.readOnly=state==='analyzing';
 if(state==='empty'){}
 else if(state==='error'){if(errKind==='invalid'&&!/^https?:/.test(u.value))u.value=u.value||'hello world'}
 else if(!u.value||!/^https?:/.test(u.value))u.value=SAMPLE;
 u.setAttribute('aria-invalid',state==='error'&&errKind!=='network'?'true':'false');
 u.setAttribute('aria-describedby',state==='error'?'errB':'');}
var c=$('#check');if(c)c.disabled=state==='analyzing';
errText();setProgress();
var dl=$('#dlLbl');if(dl)dl.textContent=kind==='video'?t('dlVideo'):t('dlAudio');
var d=$('#demo');if(d)d.value=state==='error'?'error-'+errKind:state;
var sv=$('#save');if(sv&&state!=='done')sv.dataset.saved='';
var sl=$('#saveLbl');if(sl)sl.textContent=sv&&sv.dataset.saved?t('saved'):t('save')}
function apply(){
document.documentElement.lang=lang;
$$('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)});
$$('[data-ph]').forEach(function(e){e.placeholder=t(e.dataset.ph)});
$$('[data-al]').forEach(function(e){e.setAttribute('aria-label',t(e.dataset.al))});
var l=$('#lang');if(l){l.textContent=lang==='en'?'VI':'EN';l.setAttribute('aria-label',t('langLabel'))}
$$('.sizeNote').forEach(function(e){e.textContent=t('sizeNote')});
renderQ();renderLists();render();icons()}
function stop(){clearInterval(timer);clearTimeout(tm)}
function go(s,ek){stop();state=s;if(ek)errKind=ek;if(s==='empty'){var u=$('#url');if(u)u.value=''}
if(s==='downloading'&&!timer&&pct>=100)pct=64;render()}
function check(){
var u=$('#url'),v=(u.value||'').trim();stop();
if(!/^https?:\/\/\S+\.\S+/i.test(v)){errKind='invalid';state='error';render();return}
if(!SUPPORTED.test(v)){errKind='unsupported';state='error';render();return}
if(/offline/i.test(v)){errKind='network';state='error';render();return}
state='analyzing';render();tm=setTimeout(function(){state=/playlist|list=/i.test(v)?'list':'result';render()},1600)}
function startDl(){stop();pct=0;state='downloading';render();
timer=setInterval(function(){pct=Math.min(100,pct+Math.ceil(Math.random()*8));setProgress();if(pct>=100){stop();state='done';render()}},140)}
function init(){
var f=$('#f');
if(f)f.addEventListener('submit',function(e){e.preventDefault();check()});
var p=$('#paste');if(p)p.addEventListener('click',function(){
 var fill=function(v){$('#url').value=v||SAMPLE;check()};
 if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(v){fill(/^https?:/.test(v)?v:SAMPLE)},function(){fill(SAMPLE)})}else fill(SAMPLE)});
var l=$('#lang');if(l)l.addEventListener('click',function(){lang=lang==='en'?'vi':'en';apply()});
$$('input[name=kind]').forEach(function(r){r.addEventListener('change',function(){kind=r.value;renderQ();render()})});
function on(id,fn){var e=$(id);if(e)e.addEventListener('click',fn)}
on('#cancelA',function(){go('empty')});on('#dl',startDl);on('#cancelD',function(){go('result')});
on('#another',function(){go('empty');var u=$('#url');if(u)u.focus()});
on('#retry',function(){if(errKind==='network'){$('#url').value=$('#url').value||SAMPLE;check()}else{go('empty');$('#url').focus()}});
on('#clear',function(){go('empty');$('#url').focus()});
on('#save',function(){this.dataset.saved='1';render()});
var d=$('#demo');if(d)d.addEventListener('change',function(){var v=d.value;stop();if(v.indexOf('error-')===0){errKind=v.slice(6);state='error'}else state=v;if(v==='downloading')pct=64;if(v==='empty'){var u=$('#url');if(u)u.value=''}if(v==='list'){$('#url').value='https://www.youtube.com/playlist?list=PLboat'}else if(v!=='empty'&&v.indexOf('error')!==0){$('#url').value=SAMPLE}if(v==='error-unsupported')$('#url').value='https://example.com/clip';if(v==='error-invalid')$('#url').value='hello world';render()});
if(qs.has('bare')){var dm=$('#demoBar');if(dm)dm.hidden=true}
var s0=qs.get('s');
if(s0){if(s0.indexOf('error-')===0){errKind=s0.slice(6);state='error'}else state=s0;
 var u=$('#url');
 if(s0==='list')u.value='https://www.youtube.com/playlist?list=PLboat';
 else if(s0==='error-invalid')u.value='hello world';
 else if(s0==='error-unsupported')u.value='https://example.com/clip';
 else if(s0!=='empty')u.value=SAMPLE;
 if(s0==='downloading')pct=64}
apply()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

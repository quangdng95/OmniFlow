<style>
:root{--bg:#FAFAF7;--ink:#0A0A0A;--muted:#4A4A4A;--blue:#1738FF;--yt:#C80000;--lime:#C6FF3D;--yel:#FFD60A;
--d:"Space Grotesk","Arial Black",system-ui,sans-serif;--b:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--b);padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.blk :focus-visible,.dark :focus-visible{outline-color:#fff}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:12px 16px;z-index:10}.skip:focus{left:8px}
.in{max-width:1200px;margin:0 auto;padding:0 20px}
header.top{display:flex;justify-content:space-between;align-items:center;min-height:64px;border-bottom:3px solid var(--ink)}
.brand{font:700 26px var(--d);letter-spacing:-.04em;text-transform:uppercase;color:var(--ink);text-decoration:none;min-height:44px;display:flex;align-items:center}
.brand span{background:var(--ink);color:var(--yel);padding:0 6px;margin-left:2px}
nav{display:flex;gap:6px}
.nb{min-height:44px;min-width:44px;padding:0 14px;background:transparent;border:3px solid var(--ink);font:700 16px var(--d);display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);text-transform:uppercase}
.nb:hover{background:var(--ink);color:#fff}
.hero{padding:28px 0 28px}
h1{font:700 clamp(52px,17vw,168px)/.86 var(--d);letter-spacing:-.06em;text-transform:uppercase;margin:0 0 20px}
h1 em{font-style:normal;color:var(--blue)}
.sub{font-size:19px;margin:0 0 22px;max-width:30em}
.lab{display:inline-block;font:700 18px var(--d);margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;background:var(--ink);box-shadow:6px 6px 0 var(--blue)}
.bar input{flex:1 1 100%;min-width:0;height:68px;background:#fff;border:3px solid var(--ink);padding:0 18px;font:500 20px var(--b);outline:0}
.bar input::placeholder{color:#555;opacity:1}
.bar input:focus-visible{outline:4px solid var(--blue);outline-offset:-4px}
.bar input[aria-invalid=true]{background:#FFF1B8}
.bar button{flex:1 1 50%;min-height:60px;border:0;background:var(--ink);color:#fff;font:700 18px var(--d);text-transform:uppercase;display:inline-flex;gap:10px;align-items:center;justify-content:center}
.bar button:hover{background:#222}
.bar #check{background:var(--yel);color:var(--ink)}.bar #check:hover{background:#FFE55C}
.bar #check:disabled{opacity:.6}
.bar button:focus-visible{outline-color:#fff;outline-offset:-6px}
.bar #check:focus-visible{outline-color:var(--ink)}
.flow{margin:16px 0 0;font-weight:500}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);border-top:3px solid var(--ink);margin-top:8px}
.tile{padding:16px 16px 18px;min-height:96px;display:flex;align-items:flex-end;font:700 clamp(24px,6vw,40px)/1 var(--d);letter-spacing:-.04em;color:#fff;border-bottom:3px solid var(--ink)}
.tile:nth-child(odd){border-right:3px solid var(--ink)}
.t-yt{background:#C80000}.t-tt{background:#0A0A0A;color:#3DF5EE}.t-ig{background:#B1226F}.t-fb{background:#1558D6}
.t-x{background:#222}.t-th{background:#6A3DE8}.t-li{background:#0A66C2}.t-rn{background:#D6112A}
.tilenote{margin:14px 0 0;font-weight:500}
/* big blocks */
.blk{color:#fff;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:28px 0 36px}
.blk.yt{background:var(--yt)}
.blk.dark{background:var(--ink)}
.blk.done{background:var(--lime);color:var(--ink)}
.blk.err{background:var(--ink)}
.bigs{font:700 clamp(40px,12vw,120px)/.9 var(--d);letter-spacing:-.05em;text-transform:uppercase;margin:0 0 14px}
.status{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.spin svg{animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.link{background:none;border:0;min-height:44px;min-width:44px;padding:0 4px;font:700 17px var(--d);text-decoration:underline;text-underline-offset:4px;color:inherit}
.errwrap{display:grid;gap:12px}
.errwrap p{font-size:20px;margin:0;max-width:30em}
.errwrap .ic{color:var(--yel)}
.errwrap .bigs{color:var(--yel)}
.tag{display:inline-flex;align-items:center;gap:8px;font:700 16px var(--d);text-transform:uppercase;border:3px solid currentColor;padding:2px 10px;margin-bottom:14px}
.res{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.thumb{background:#000;display:grid;place-items:center;color:#fff;position:relative;border:3px solid #fff}
.thumb.big{aspect-ratio:16/9;width:100%}
.thumb.big .dur{position:absolute;right:8px;bottom:8px;background:#fff;color:#000;font:700 16px var(--d);padding:0 8px}
.thumb.sm{width:64px;height:48px;flex:none;background:#333;border:2px solid currentColor}
.title{font:700 clamp(28px,6vw,52px)/1.02 var(--d);letter-spacing:-.04em;margin:0 0 6px}
.meta{margin:0 0 20px;font-size:18px}
.grp{border:0;padding:0;margin:0 0 18px;min-width:0}.grp legend{font:700 17px var(--d);padding:0;margin-bottom:8px}
.seg{display:flex;border:3px solid #fff}
.seg label{flex:1}.seg input,.opt input{position:absolute;opacity:0;width:1px;height:1px}
.seg .s{display:flex;justify-content:center;align-items:center;gap:8px;min-height:56px;font:700 19px var(--d);text-transform:uppercase;cursor:pointer}
.seg label+label .s{border-left:3px solid #fff}
.seg input:checked+.s{background:#fff;color:var(--yt)}
.seg input:focus-visible+.s,.opt input:focus-visible+span{outline:4px solid var(--yel);outline-offset:-7px}
#qopts{display:flex;flex-wrap:wrap;gap:8px}
.opt span{display:flex;align-items:center;min-height:48px;padding:0 20px;border:3px solid #fff;font:700 17px var(--d);cursor:pointer}
.opt input:checked+span{background:#fff;color:var(--yt)}
.opt span:hover{background:rgba(255,255,255,.18)}.opt input:checked+span:hover{background:#fff}
.cta{min-height:64px;width:100%;border:3px solid var(--ink);background:var(--ink);color:#fff;font:700 22px var(--d);text-transform:uppercase;display:inline-flex;gap:12px;align-items:center;justify-content:center;box-shadow:6px 6px 0 #fff;padding:0 24px}
.cta:hover{background:#222}.cta:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #fff}
.cta.light{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
.cta.light:hover{background:var(--yel)}
.cta.ghost{background:transparent;color:inherit;border-color:currentColor;box-shadow:none}
.cta.yel{background:var(--yel);color:var(--ink);border-color:var(--ink);box-shadow:6px 6px 0 #fff}
.row2{display:grid;gap:14px}
.prog{height:28px;border:3px solid #fff;margin:8px 0 18px}
.bar-fill{height:100%;background:#fff;width:0;transition:width .14s linear}
.bigp{font:700 clamp(80px,26vw,240px)/.85 var(--d);letter-spacing:-.07em;font-variant-numeric:tabular-nums;margin:0}
.sizeNote{font-size:18px;margin:0 0 20px;font-weight:500}
/* lists as typographic rows */
ul.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;min-height:76px;border-top:3px solid currentColor;padding:10px 0}
.row:last-child{border-bottom:3px solid currentColor}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row b{font:700 clamp(18px,3.2vw,26px)/1.15 var(--d);letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row small{font-size:16px}
.idx{font:700 22px var(--d);width:34px}
.rbtn{min-height:48px;padding:0 16px;border:3px solid currentColor;background:transparent;font:700 16px var(--d);text-transform:uppercase;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.rbtn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.blk .rbtn:hover{background:#fff;color:var(--ink);border-color:#fff}
.rbtn.is-done{opacity:1;border-style:dashed}
.sec{padding-block:36px}
.sec h2{font:700 clamp(30px,7vw,64px)/.95 var(--d);letter-spacing:-.05em;text-transform:uppercase;margin:0 0 6px}
.sec .note{margin:0 0 16px}
.plhead{display:grid;gap:14px;margin-bottom:18px}
.plhead h2{margin:0}
.ab{border-top:3px solid var(--ink)}
.ab details{border-bottom:3px solid var(--ink)}
.ab summary{list-style:none;min-height:64px;display:flex;align-items:center;justify-content:space-between;font:700 22px var(--d);letter-spacing:-.02em;cursor:pointer}
.ab summary::-webkit-details-marker{display:none}
.ab summary svg{transition:transform .2s}.ab details[open] summary svg{transform:rotate(180deg)}
.ab .c{padding:0 0 20px;max-width:42em}.ab ol{margin:0;padding-left:22px}.ab dt{font-weight:700;margin-top:12px}.ab dd{margin:0}.ab dl{margin:0}
footer{padding:24px 0 48px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:var(--ink);font-weight:700;min-height:44px;display:inline-flex;align-items:center}
#demoBar{position:fixed;left:8px;bottom:8px;z-index:50;background:var(--blue);color:#fff;padding:6px 10px;font-size:16px;display:flex;gap:8px;align-items:center}
#demoBar select{min-height:36px;font-size:16px;border:0;padding:0 6px;color:#000}
@media(min-width:760px){
.in{padding:0 40px}
.hero{padding:48px 0 48px}
.bar{flex-wrap:nowrap}
.bar input{flex:1 1 auto;height:84px;font-size:26px;padding:0 28px}
.bar button{flex:0 0 auto;min-height:84px;padding:0 32px;font-size:20px}
.tiles{grid-template-columns:repeat(4,1fr)}
.tile{min-height:180px;padding:20px}
.tile:nth-child(odd){border-right:0}.tile:not(:nth-child(4n)){border-right:3px solid var(--ink)}
.res{grid-template-columns:5fr 7fr;gap:48px}
.row2{grid-template-columns:2fr 1fr}
.plhead{grid-template-columns:1fr auto;align-items:end}
.cta{width:auto;min-width:320px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
